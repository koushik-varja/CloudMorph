services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudmorph
      POSTGRES_USER: cloudmorph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmorph -d cloudmorph"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - cloudmorph_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cloudmorph:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cloudmorph
      CORS_ORIGINS: http://localhost:5173
      MAX_UPLOAD_BYTES: 5242880
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  cloudmorph_pg:
